<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบค้นหาหนังสือเรียนฟรี 15 ปี</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; background: #f8fafc; }
:root {
  --sb-primary:#1a56db; --sb-primary-dark:#1e40af; --sb-primary-light:#eff6ff;
  --sb-accent:#f59e0b;
  --sb-gray-50:#f9fafb; --sb-gray-100:#f3f4f6; --sb-gray-200:#e5e7eb;
  --sb-gray-300:#d1d5db; --sb-gray-400:#9ca3af; --sb-gray-500:#6b7280;
  --sb-gray-600:#4b5563; --sb-gray-700:#374151; --sb-gray-800:#1f2937;
  --sb-shadow:0 4px 6px -1px rgba(0,0,0,.08);
}
/* TOP NAV */
#sb-topnav {
  position:sticky; top:0; z-index:200;
  background:#fff; border-bottom:1px solid var(--sb-gray-200);
  box-shadow:var(--sb-shadow); padding:0 24px;
}
.sb-topnav-inner {
  max-width:1400px; margin:0 auto;
  display:flex; align-items:center; gap:16px; height:52px;
}
.sb-back-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 14px; border-radius:8px;
  background:var(--sb-gray-100); color:var(--sb-gray-700);
  text-decoration:none; font-size:.85rem; font-weight:600;
  border:1px solid var(--sb-gray-200); transition:background .15s; white-space:nowrap;
}
.sb-back-btn:hover { background:var(--sb-gray-200); }
.sb-nav-title { font-size:1rem; font-weight:700; color:var(--sb-primary); }
/* STICKY SEARCH */
#sb-sticky {
  position:sticky; top:52px; z-index:100;
  background:#fff; border-bottom:1px solid var(--sb-gray-200);
  box-shadow:0 2px 8px rgba(0,0,0,.06); padding:10px 24px;
}
.sb-sticky-inner { max-width:1400px; margin:0 auto; }
.sb-field-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.sb-tab {
  padding:5px 14px; border-radius:20px; border:2px solid var(--sb-gray-200);
  background:var(--sb-gray-50); cursor:pointer; font-size:.83rem;
  color:var(--sb-gray-600); transition:all .16s; font-weight:500; font-family:inherit;
}
.sb-tab:hover { border-color:var(--sb-primary); color:var(--sb-primary); }
.sb-tab.active { background:var(--sb-primary); border-color:var(--sb-primary); color:#fff; }
.sb-input-row { display:flex; gap:8px; align-items:center; }
#sb-input {
  flex:1; padding:9px 16px; border:2px solid var(--sb-gray-200); border-radius:8px;
  font-size:.95rem; font-family:inherit; outline:none; background:#fff;
  color:var(--sb-gray-800); transition:border-color .16s;
}
#sb-input:focus { border-color:var(--sb-primary); }
.sb-btn {
  padding:9px 20px; border:none; border-radius:8px; font-size:.9rem;
  font-family:inherit; cursor:pointer; font-weight:600; transition:background .16s; white-space:nowrap;
}
.sb-btn-search { background:var(--sb-primary); color:#fff; }
.sb-btn-search:hover { background:var(--sb-primary-dark); }
.sb-btn-clear { background:var(--sb-gray-100); color:var(--sb-gray-600); padding:9px 13px; }
.sb-btn-clear:hover { background:var(--sb-gray-200); }
.sb-hint { margin-top:6px; font-size:.78rem; color:var(--sb-gray-400); }
/* MAIN */
#sb-main { max-width:1400px; margin:0 auto; padding:20px 24px 40px; }
/* STATS */
#sb-stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.sb-chip {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--sb-primary-light); border-radius:20px;
  padding:5px 14px; font-size:.83rem; color:var(--sb-primary); font-weight:600;
}
.sb-chip .sb-num { font-size:1rem; color:var(--sb-primary-dark); }
/* RESULT */
.sb-result-header { display:flex; align-items:flex-end; margin-bottom:12px; flex-wrap:wrap; gap:6px; }
.sb-result-count { font-size:.95rem; color:var(--sb-gray-600); }
.sb-result-count strong { color:var(--sb-primary); font-size:1.05rem; }
.sb-result-time { font-size:.78rem; color:var(--sb-gray-400); margin-top:2px; }
/* TABLE */
.sb-table-wrap {
  background:#fff; border:1px solid var(--sb-gray-200);
  border-radius:10px; box-shadow:var(--sb-shadow); overflow:hidden;
}
.sb-table-scroll { overflow-x:auto; }
#sb-table { width:100%; border-collapse:collapse; font-size:.85rem; min-width:900px; }
#sb-table thead tr {
  background:linear-gradient(135deg,var(--sb-primary) 0%,var(--sb-primary-dark) 100%);
}
#sb-table thead th {
  padding:12px 13px; text-align:left; font-weight:600; white-space:nowrap;
  cursor:pointer; user-select:none; color:#fff; border:none; font-size:.83rem;
}
#sb-table thead th:hover { background:rgba(255,255,255,.1); }
#sb-table thead th .si { margin-left:4px; opacity:.55; font-size:.7rem; }
#sb-table thead th.sorted .si { opacity:1; }
#sb-table tbody tr { border-bottom:1px solid var(--sb-gray-100); transition:background .1s; }
#sb-table tbody tr:last-child { border-bottom:none; }
#sb-table tbody tr:hover { background:var(--sb-primary-light); }
#sb-table tbody tr:nth-child(even) { background:var(--sb-gray-50); }
#sb-table tbody tr:nth-child(even):hover { background:var(--sb-primary-light); }
#sb-table td { padding:10px 13px; vertical-align:middle; color:var(--sb-gray-700); border:none; }
.td-order  { text-align:center; color:var(--sb-gray-400); font-size:.8rem; width:70px; }
.td-date   { white-space:nowrap; color:var(--sb-gray-500); font-size:.8rem; width:95px; }
.td-code   { font-weight:700; color:var(--sb-primary); white-space:nowrap; }
.td-title  { font-weight:600; color:var(--sb-gray-800); min-width:170px; }
.td-author { min-width:120px; }
.td-price  { text-align:right; font-weight:700; color:var(--sb-accent); white-space:nowrap; }
.td-pages  { text-align:center; color:var(--sb-gray-500); }
.td-pub    { min-width:130px; }
.stag {
  display:inline-block; padding:1px 7px; border-radius:10px;
  font-size:.73rem; margin:1px 2px; background:var(--sb-gray-100); color:var(--sb-gray-600);
}
.stag.paper { background:#ecfdf5; color:#065f46; }
.stag.color { background:#eff6ff; color:#1e40af; }
.stag.tsize { background:#fef3c7; color:#92400e; }
mark { background:#fef08a; color:#713f12; border-radius:3px; padding:0 2px; }
.sb-state { text-align:center; padding:60px 20px; color:var(--sb-gray-400); }
.sb-state .sb-icon { font-size:2.8rem; margin-bottom:12px; }
.sb-state p { font-size:.95rem; margin-top:4px; }
.sb-state .sb-sub { font-size:.82rem; margin-top:5px; }
@media (max-width:600px) {
  .sb-input-row { flex-wrap:wrap; }
  .sb-btn-search { width:100%; }
  #sb-main { padding:16px; }
}
</style>
</head>
<body>

<div id="sb-topnav">
  <div class="sb-topnav-inner">
    <a class="sb-back-btn" href="https://it2027.github.io/STCLibrary/#home">&#8592; หน้าแรก</a>
    <span class="sb-nav-title">📚 ระบบค้นหาหนังสือเรียนฟรี 15 ปี</span>
  </div>
</div>

<div id="sb-sticky">
  <div class="sb-sticky-inner">
    <div class="sb-field-tabs">
      <button class="sb-tab active" data-field="all"       onclick="sbSelectField(this)">ทั้งหมด</button>
      <button class="sb-tab"        data-field="code"      onclick="sbSelectField(this)">รหัสวิชา</button>
      <button class="sb-tab"        data-field="title"     onclick="sbSelectField(this)">ชื่อหนังสือ</button>
      <button class="sb-tab"        data-field="author"    onclick="sbSelectField(this)">ผู้แต่ง</button>
      <button class="sb-tab"        data-field="publisher" onclick="sbSelectField(this)">สำนักพิมพ์</button>
    </div>
    <div class="sb-input-row">
      <input id="sb-input" type="text" placeholder="พิมพ์คำค้นหา..."
             onkeydown="if(event.key==='Enter') sbSearch()">
      <button class="sb-btn sb-btn-search" onclick="sbSearch()">🔍 ค้นหา</button>
      <button class="sb-btn sb-btn-clear"  onclick="sbClear()">✕</button>
    </div>
    <div class="sb-hint" id="sb-hint">💡 ค้นหาทุกฟิลด์ — พิมพ์บางส่วนก็ได้ เช่น "20000" หรือ "ภาษาไทย"</div>
  </div>
</div>

<div id="sb-main">
  <div id="sb-stats"><div class="sb-chip">⏳ กำลังโหลดข้อมูล...</div></div>
  <div id="sb-results">
    <div class="sb-state">
      <div class="sb-icon">📖</div>
      <p>พิมพ์คำค้นหาแล้วกด <strong>ค้นหา</strong></p>
      <div class="sb-sub">รองรับการค้นหาภาษาไทยและภาษาอังกฤษ</div>
    </div>
  </div>
</div>

<script>
(function() {
  const DATA_URL = '../books.json';
  let sbBooks=[],sbField='all',sbAllHits=[],sbSortCol=null,sbSortAsc=true;
  const HINTS={
    all:'💡 ค้นหาทุกฟิลด์ — พิมพ์บางส่วนก็ได้ เช่น "20000" หรือ "ภาษาไทย"',
    code:'💡 ค้นหารหัสวิชา เช่น "20000-1101" หรือ "20000"',
    title:'💡 ค้นหาชื่อหนังสือ เช่น "ภาษาไทย" หรือ "คณิตศาสตร์"',
    author:'💡 ค้นหาชื่อผู้แต่ง เช่น "อนุจิตร" หรือ "สมชาย"',
    publisher:'💡 ค้นหาสำนักพิมพ์ เช่น "พัฒนาวิชาการ" หรือ "ศูนย์"',
  };
  fetch(DATA_URL)
    .then(r=>{if(!r.ok)throw new Error('โหลดไฟล์ไม่สำเร็จ: '+r.status);return r.json();})
    .then(data=>{
      sbBooks=data;
      const codes=new Set(data.map(b=>b.code));
      const pubs=new Set(data.map(b=>b.publisher).filter(Boolean));
      document.getElementById('sb-stats').innerHTML=`
        <div class="sb-chip">📚 หนังสือทั้งหมด <span class="sb-num">${data.length.toLocaleString()}</span> รายการ</div>
        <div class="sb-chip">🔖 รหัสวิชา <span class="sb-num">${codes.size.toLocaleString()}</span> รหัส</div>
        <div class="sb-chip">🏢 สำนักพิมพ์ <span class="sb-num">${pubs.size.toLocaleString()}</span> แห่ง</div>`;
    })
    .catch(err=>{
      document.getElementById('sb-stats').innerHTML=`<div class="sb-chip">⚠️ ${sbEsc(err.message)}</div>`;
    });
  window.sbSelectField=function(el){
    document.querySelectorAll('.sb-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active'); sbField=el.dataset.field;
    document.getElementById('sb-hint').textContent=HINTS[sbField];
    document.getElementById('sb-input').placeholder=
      sbField==='all'?'พิมพ์คำค้นหา...':
      sbField==='code'?'ระบุรหัสวิชา เช่น 20000-1101':
      sbField==='title'?'ระบุชื่อหนังสือ':
      sbField==='author'?'ระบุชื่อผู้แต่ง':'ระบุชื่อสำนักพิมพ์';
  };
  window.sbSearch=function(){
    const kw=document.getElementById('sb-input').value.trim();
    if(!kw){const i=document.getElementById('sb-input');i.style.borderColor='#ef4444';setTimeout(()=>i.style.borderColor='',900);return;}
    if(!sbBooks.length){document.getElementById('sb-results').innerHTML='<div class="sb-state"><div class="sb-icon">⚠️</div><p>ข้อมูลยังไม่โหลด กรุณารอสักครู่</p></div>';return;}
    const t0=performance.now(),kwL=kw.toLowerCase();
    const hits=sbBooks.filter(b=>{
      switch(sbField){
        case'code':return b.code.toLowerCase().includes(kwL);
        case'title':return b.title.toLowerCase().includes(kwL);
        case'author':return b.author.toLowerCase().includes(kwL);
        case'publisher':return b.publisher.toLowerCase().includes(kwL);
        default:return b.code.toLowerCase().includes(kwL)||b.title.toLowerCase().includes(kwL)||b.author.toLowerCase().includes(kwL)||b.publisher.toLowerCase().includes(kwL);
      }
    });
    const ms=Math.round(performance.now()-t0);
    sbAllHits=hits; sbSortCol=null; sbSortAsc=true; sbRender(hits,kw,ms);
  };
  window.sbClear=function(){
    document.getElementById('sb-input').value='';
    document.getElementById('sb-input').focus(); sbAllHits=[];
    document.getElementById('sb-results').innerHTML='<div class="sb-state"><div class="sb-icon">📖</div><p>พิมพ์คำค้นหาแล้วกด <strong>ค้นหา</strong></p><div class="sb-sub">รองรับการค้นหาภาษาไทยและภาษาอังกฤษ</div></div>';
  };
  function sbRender(data,kw,ms){
    const wrap=document.getElementById('sb-results');
    if(!data.length){wrap.innerHTML='<div class="sb-state"><div class="sb-icon">🔍</div><p>ไม่พบหนังสือที่ตรงกับ "<strong>'+sbEsc(kw)+'</strong>"</p><div class="sb-sub">ลองเปลี่ยนคำค้นหาหรือเลือกค้นหา "ทั้งหมด"</div></div>';return;}
    wrap.innerHTML=sbBuildTable(data,kw,ms);
  }
  function sbBuildTable(data,kw,ms){
    const cols=[
      {key:'order',label:'ลำดับที่ประกาศ',cls:'td-order'},
      {key:'date',label:'วันที่ประกาศ',cls:'td-date'},
      {key:'code',label:'รหัสวิชา',cls:'td-code'},
      {key:'title',label:'ชื่อหนังสือ',cls:'td-title'},
      {key:'author',label:'ผู้แต่ง',cls:'td-author'},
      {key:'price',label:'ราคา (บาท)',cls:'td-price'},
      {key:'pages',label:'หน้า',cls:'td-pages'},
      {key:'paper',label:'กระดาษ',cls:''},
      {key:'color',label:'การพิมพ์',cls:''},
      {key:'size',label:'ขนาด',cls:''},
      {key:'publisher',label:'สำนักพิมพ์',cls:'td-pub'},
    ];
    const hl=(txt,field)=>{const s={code:1,title:1,author:1,publisher:1};return s[field]?sbHl(txt,kw):sbEsc(txt);};
    const makeTags=(val,cls)=>val&&val!=='-'?val.split(', ').map(t=>`<span class="stag ${cls}">${sbEsc(t)}</span>`).join(''):'<span style="color:var(--sb-gray-300)">-</span>';
    const thead=cols.map(c=>`<th class="${c.cls}" data-col="${c.key}" onclick="sbSortBy('${c.key}')">${c.label}<span class="si">⇅</span></th>`).join('');
    const tbody=data.map(b=>`<tr>
      <td class="td-order">${sbEsc(b.order)||'-'}</td>
      <td class="td-date">${sbEsc(b.date)||'-'}</td>
      <td class="td-code">${hl(b.code,'code')}</td>
      <td class="td-title">${hl(b.title,'title')}</td>
      <td class="td-author">${hl(b.author,'author')||'-'}</td>
      <td class="td-price">${b.price!=null?Number(b.price).toLocaleString():'-'}</td>
      <td class="td-pages">${sbEsc(b.pages)||'-'}</td>
      <td>${makeTags(b.paper,'paper')}</td>
      <td>${makeTags(b.color,'color')}</td>
      <td>${makeTags(b.size,'tsize')}</td>
      <td class="td-pub">${hl(b.publisher,'publisher')||'-'}</td>
    </tr>`).join('');
    return `<div class="sb-result-header"><div>
      <div class="sb-result-count">พบ <strong>${data.length.toLocaleString()}</strong> รายการ</div>
      <div class="sb-result-time">ใช้เวลา ${typeof ms==='number'?ms+' ms':'-'} · คลิกหัวตารางเพื่อเรียงลำดับ</div>
    </div></div>
    <div class="sb-table-wrap"><div class="sb-table-scroll">
      <table id="sb-table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>
    </div></div>`;
  }
  window.sbSortBy=function(col){
    if(!sbAllHits.length)return;
    sbSortAsc=(sbSortCol===col)?!sbSortAsc:true; sbSortCol=col;
    const sorted=[...sbAllHits].sort((a,b)=>{
      let va=a[col]??'',vb=b[col]??'';
      if(col==='price'||col==='pages'){va=parseFloat(va)||0;vb=parseFloat(vb)||0;return sbSortAsc?va-vb:vb-va;}
      return sbSortAsc?String(va).localeCompare(String(vb),'th'):String(vb).localeCompare(String(va),'th');
    });
    const kw=document.getElementById('sb-input').value.trim();
    document.getElementById('sb-results').innerHTML=sbBuildTable(sorted,kw,'-');
    document.querySelectorAll('#sb-table thead th').forEach(th=>{
      if(th.dataset.col===col){th.querySelector('.si').textContent=sbSortAsc?' ▲':' ▼';th.classList.add('sorted');}
    });
  };
  function sbEsc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function sbHl(text,kw){if(!text||!kw)return sbEsc(text);const re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return sbEsc(text).replace(re,'<mark>$1</mark>');}
})();
</script>
</body>
</html>
